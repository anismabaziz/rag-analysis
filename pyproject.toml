[project]
name = "rag-analysis"
version = "0.1.0"
description = "Measures how dense, sparse, and hybrid retrieval compare on the same corpus, under one frozen generation setup, so the differences in the results table come from retrieval and nothing else."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdelaziz" }]
keywords = ["rag", "retrieval", "hybrid-search", "qdrant", "evaluation"]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "llama-index-core>=0.14.22",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-groq>=0.5.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.65.0",
    "tqdm>=4.67.3",
    "unstructured[pdf]>=0.22.31",
]

[project.scripts]
# The harness is run as a command, so neither a reader nor an agent has to know the module
# layout to ingest a corpus, ask a question, or list what can be asked.
rag-analysis = "main:cli"

# The project is installed rather than run from a checkout, which is what puts the command
# above on the path at all.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "architectures",
    "build_index.py",
    "config",
    "core",
    "corpus",
    "data",
    "evaluation",
    "main.py",
    "vector",
]

[dependency-groups]
dev = [
    "check-requirements-txt>=1.4.2",
    "playwright>=1.63.0",
    "pypdf>=6.12.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Errors only, for now: the code is tab-indented and mid-migration, so the
# formatting and import-order rules would bury the failures worth acting on.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
